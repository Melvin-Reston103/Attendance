<div class="fixed inset-0 bg-[#070b14]/80 backdrop-blur-md z-40 flex items-center justify-center p-4" (click)="onCancel()">
  <div class="bg-[#0e1626] border border-[#1a273f] rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-5 border-b border-[#1a273f]">
      <div>
        <h2 class="text-lg font-bold text-white">Edit User</h2>
        <p class="text-xs text-slate-400">Update staff access and account details</p>
      </div>
      <button type="button" class="w-9 h-9 inline-flex items-center justify-center rounded-lg bg-[#141e33] border border-[#213252] text-slate-400" aria-label="Close" (click)="onCancel()">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <form class="px-6 py-5" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="edit-name">Full Name</label>
          <input id="edit-name" type="text" formControlName="name" class="w-full h-11 px-4 rounded-xl bg-[#141e33] border border-[#213252] text-sm text-slate-100 focus:outline-none focus:border-emerald-500" />
          @if (fieldInvalid('name')) { <p class="mt-1.5 text-[11px] text-red-400">Full name is required.</p> }
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="edit-employee-id">Employee ID</label>
          <input id="edit-employee-id" type="text" formControlName="employeeId" class="w-full h-11 px-4 rounded-xl bg-[#141e33] border border-[#213252] text-sm text-slate-100 focus:outline-none focus:border-emerald-500" />
          @if (fieldInvalid('employeeId')) { <p class="mt-1.5 text-[11px] text-red-400">Employee ID is required.</p> }
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="edit-role">System Role</label>
          <select id="edit-role" formControlName="role" class="w-full h-11 px-4 rounded-xl bg-[#141e33] border border-[#213252] text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            @for (role of systemRoles; track role.id) { <option [value]="role.id">{{ role.label }}</option> }
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="edit-scope">Assigned Faction Unit</label>
          <select id="edit-scope" formControlName="scope" class="w-full h-11 px-4 rounded-xl bg-[#141e33] border border-[#213252] text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            <option value="global">Global - All Units</option>
            <option value="custom">Custom Kiosk Scope</option>
            @for (faction of factions; track faction.id) { <option [value]="faction.id">{{ faction.label }}</option> }
          </select>
        </div>
      </div>
      @if (form.controls.scope.value === 'custom') {
        <div class="mt-4">
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="edit-scope-label">Custom Scope Label</label>
          <input id="edit-scope-label" type="text" formControlName="scopeLabel" class="w-full h-11 px-4 rounded-xl bg-[#141e33] border border-[#213252] text-sm text-slate-100 focus:outline-none focus:border-emerald-500" />
        </div>
      }
      <div class="mt-4">
        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="edit-password">New Password <span class="font-normal text-slate-500">(leave blank to keep current)</span></label>
        <input id="edit-password" type="password" formControlName="password" autocomplete="new-password" class="w-full h-11 px-4 rounded-xl bg-[#141e33] border border-[#213252] text-sm text-slate-100 focus:outline-none focus:border-emerald-500" />
      </div>
      @if (errorMessage()) { <p class="mt-4 text-xs text-red-400">{{ errorMessage() }}</p> }
    </form>
    <div class="flex items-center justify-end gap-2.5 px-6 py-4 border-t border-[#1a273f] bg-[#0c1322]/60">
      <button type="button" class="h-10 px-4 rounded-xl text-slate-400 text-xs font-semibold" (click)="onCancel()">Cancel</button>
      <button type="button" class="h-10 px-5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs flex items-center gap-2 disabled:opacity-50" [disabled]="saving()" (click)="onSubmit()">
        <span class="material-symbols-outlined text-[18px]">save</span>
        <span>{{ saving() ? 'Saving...' : 'Save Changes' }}</span>
      </button>
    </div>
  </div>
</div>
